<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zawadi Admin Console</title>
<style>
:root {
  color-scheme: light;
  --bg: #f5f7f4;
  --surface: #ffffff;
  --surface-alt: #eef3ed;
  --ink: #17221f;
  --muted: #65746e;
  --line: #dce4dc;
  --line-strong: #bdc9c1;
  --green: #0f6e56;
  --green-soft: #e0f3eb;
  --blue: #315d91;
  --blue-soft: #e6eef7;
  --gold: #8a671f;
  --gold-soft: #f7ebd2;
  --red: #b53a3a;
  --red-soft: #f7dddd;
  --shadow: 0 18px 50px rgba(28, 42, 37, 0.12);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-width: 320px;
  min-height: 100vh;
  background: var(--bg);
  color: var(--ink);
}

button,
input,
select,
textarea {
  font: inherit;
}

button { border: 0; }

a { color: inherit; }

.login-shell {
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 24px;
  background:
    linear-gradient(135deg, rgba(224, 243, 235, 0.78), rgba(230, 238, 247, 0.72)),
    repeating-linear-gradient(0deg, rgba(15, 110, 86, 0.08) 0, rgba(15, 110, 86, 0.08) 1px, transparent 1px, transparent 44px);
}

.login-card {
  width: min(430px, 100%);
  padding: 32px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--surface);
  box-shadow: var(--shadow);
}

.brand-row {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 22px;
}

.brand-mark {
  width: 44px;
  height: 44px;
  display: grid;
  place-items: center;
  border-radius: 8px;
  color: #fff;
  background: var(--green);
  font-weight: 900;
  box-shadow: 0 10px 22px rgba(15, 110, 86, 0.2);
}

.brand-row strong,
.brand-row span {
  display: block;
}

.brand-row span {
  margin-top: 2px;
  color: var(--muted);
  font-size: 13px;
}

.login-card h1 {
  margin: 0 0 8px;
  font-size: 28px;
  line-height: 1.1;
}

.login-card p {
  margin: 0 0 22px;
  color: var(--muted);
  line-height: 1.6;
}

label {
  display: block;
  color: var(--muted);
  font-size: 13px;
  font-weight: 760;
}

input,
select,
textarea {
  width: 100%;
  min-height: 42px;
  margin-top: 7px;
  padding: 0 12px;
  border: 1px solid var(--line);
  border-radius: 8px;
  color: var(--ink);
  background: var(--surface);
  outline: 0;
}

textarea {
  min-height: 96px;
  padding: 12px;
  resize: vertical;
}

input:focus,
select:focus,
textarea:focus {
  border-color: var(--green);
  box-shadow: 0 0 0 3px rgba(15, 110, 86, 0.12);
}

input[type="checkbox"] {
  width: 16px;
  height: 16px;
  min-height: auto;
  margin: 0 8px 0 0;
  accent-color: var(--green);
}

.form-grid {
  display: grid;
  gap: 14px;
}

.admin-app {
  min-height: 100vh;
  display: grid;
  grid-template-columns: 268px minmax(0, 1fr);
  background:
    linear-gradient(90deg, #ffffff 0 268px, transparent 268px),
    var(--bg);
}

.sidebar {
  position: sticky;
  top: 0;
  height: 100vh;
  padding: 22px;
  display: flex;
  flex-direction: column;
  gap: 22px;
  border-right: 1px solid var(--line);
  background: #16231f;
  color: #f7fbf8;
}

.side-nav {
  display: grid;
  gap: 8px;
}

.side-nav button {
  min-height: 42px;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 12px;
  border-radius: 8px;
  color: #b9c9c2;
  background: transparent;
  cursor: pointer;
  text-align: left;
  font-weight: 780;
}

.side-nav button.active,
.side-nav button:hover {
  color: #ffffff;
  background: rgba(224, 243, 235, 0.14);
}

.sidebar .brand-mark {
  background: #e0f3eb;
  color: var(--green);
}

.sidebar .brand-row span,
.sidebar .muted {
  color: #b9c9c2;
}

.sidebar .endpoint-box {
  border-color: rgba(224, 243, 235, 0.18);
  background: rgba(255, 255, 255, 0.06);
}

.sidebar .quiet-btn {
  color: #f7fbf8;
  border-color: rgba(224, 243, 235, 0.2);
  background: rgba(255, 255, 255, 0.08);
}

.admin-main {
  min-width: 0;
  padding: 26px;
  display: grid;
  gap: 18px;
  align-content: start;
}

.topbar,
.panel-head,
.toolbar,
.row-actions {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}

.topbar h1,
.panel h2 {
  margin: 3px 0 0;
  line-height: 1.12;
  letter-spacing: 0;
}

.topbar h1 { font-size: 32px; }
.panel h2 { font-size: 21px; }

.eyebrow {
  display: block;
  color: var(--green);
  font-size: 12px;
  font-weight: 880;
  text-transform: uppercase;
}

.muted {
  color: var(--muted);
}

.btn,
.primary-btn,
.danger-btn,
.quiet-btn {
  min-height: 40px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  border-radius: 8px;
  padding: 0 14px;
  cursor: pointer;
  font-weight: 780;
  white-space: nowrap;
}

.primary-btn {
  color: #fff;
  background: var(--green);
  box-shadow: 0 10px 22px rgba(15, 110, 86, 0.18);
}

.danger-btn {
  color: #fff;
  background: var(--red);
}

.quiet-btn,
.btn {
  color: var(--ink);
  background: var(--surface);
  border: 1px solid var(--line);
}

.btn:hover,
.quiet-btn:hover {
  background: var(--surface-alt);
}

.btn:disabled,
.primary-btn:disabled,
.danger-btn:disabled {
  opacity: 0.62;
  cursor: not-allowed;
}

.full { width: 100%; }

.metrics {
  display: grid;
  grid-template-columns: repeat(6, minmax(140px, 1fr));
  gap: 12px;
}

.metric,
.panel,
.category-card,
.issue-card {
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--surface);
  box-shadow: 0 8px 24px rgba(28, 42, 37, 0.05);
}

.metric {
  min-height: 92px;
  padding: 16px;
  display: grid;
  align-content: center;
  gap: 4px;
  border-top: 4px solid var(--green);
}

.metric span {
  color: var(--muted);
  font-size: 12px;
  font-weight: 820;
}

.metric strong {
  font-size: 30px;
  line-height: 1;
}

.panel {
  padding: 18px;
  overflow: hidden;
}

.admin-section-grid {
  display: grid;
  grid-template-columns: minmax(320px, 1fr) minmax(320px, 1fr);
  gap: 14px;
}

.grid-2 {
  display: grid;
  grid-template-columns: minmax(320px, 1fr) minmax(320px, 1fr);
  gap: 14px;
}

.category-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(170px, 1fr));
  gap: 12px;
  margin-top: 14px;
}

.category-card {
  min-height: 118px;
  padding: 14px;
  display: grid;
  align-content: start;
  gap: 8px;
}

.category-card span,
.category-card strong,
.category-card small {
  display: block;
}

.category-card span {
  color: var(--green);
  font-size: 12px;
  font-weight: 850;
}

.category-card strong {
  font-size: 28px;
}

.category-card small {
  color: var(--muted);
  font-size: 12px;
  line-height: 1.45;
}

.toolbar {
  margin-bottom: 14px;
  justify-content: flex-start;
}

.toolbar label {
  min-width: 180px;
  flex: 1 1 190px;
}

.toolbar .search-label {
  flex: 2 1 300px;
}

.table-shell {
  overflow: auto;
  border: 1px solid var(--line);
  border-radius: 8px;
}

table {
  width: 100%;
  min-width: 980px;
  border-collapse: separate;
  border-spacing: 0;
  table-layout: fixed;
}

th,
td {
  padding: 10px;
  border-right: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  vertical-align: top;
  text-align: left;
  overflow-wrap: anywhere;
}

th {
  position: sticky;
  top: 0;
  z-index: 1;
  color: #43524d;
  background: #eef5ee;
  font-size: 12px;
  font-weight: 880;
}

tr:last-child td { border-bottom: 0; }
th:last-child, td:last-child { border-right: 0; }

td strong,
td span,
td small {
  display: block;
}

td span,
td small {
  margin-top: 4px;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.4;
}

.pill {
  display: inline-flex;
  align-items: center;
  min-height: 26px;
  border-radius: 999px;
  padding: 0 9px;
  color: var(--blue);
  background: var(--blue-soft);
  font-size: 11px;
  font-weight: 850;
}

.pill.green {
  color: var(--green);
  background: var(--green-soft);
}

.pill.gold {
  color: var(--gold);
  background: var(--gold-soft);
}

.pill.red {
  color: var(--red);
  background: var(--red-soft);
}

.tag-row {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 8px;
}

.source-list,
.recent-list,
.issue-list {
  display: grid;
  gap: 10px;
  margin-top: 14px;
}

.source-row,
.recent-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: center;
  gap: 14px;
  padding: 11px 12px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #fbfcf9;
}

.recent-row a {
  color: var(--green);
  font-size: 12px;
  font-weight: 820;
  text-decoration: none;
}

.issue-card {
  padding: 14px;
  display: grid;
  gap: 8px;
}

.issue-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.issue-card p {
  margin: 0;
  color: var(--muted);
  line-height: 1.55;
}

.endpoint-box {
  display: grid;
  gap: 10px;
  padding: 14px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #fbfcf9;
}

code,
pre {
  font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
}

pre {
  margin: 0;
  overflow: auto;
  padding: 12px;
  border-radius: 8px;
  color: #263530;
  background: #eef3ed;
  font-size: 12px;
  line-height: 1.45;
}

.empty {
  min-height: 160px;
  display: grid;
  place-items: center;
  border: 1px dashed var(--line-strong);
  border-radius: 8px;
  color: var(--muted);
  background: rgba(255, 255, 255, 0.65);
}

.modal-backdrop {
  position: fixed;
  inset: 0;
  z-index: 20;
  display: grid;
  place-items: center;
  padding: 18px;
  background: rgba(22, 35, 31, 0.42);
}

.modal {
  width: min(900px, 100%);
  max-height: min(880px, calc(100vh - 36px));
  overflow: auto;
  padding: 18px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--surface);
  box-shadow: var(--shadow);
}

.modal.small {
  width: min(560px, 100%);
}

.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 16px;
}

.modal-header h2 {
  margin: 0;
  font-size: 22px;
}

.editor-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px;
}

.editor-grid label.wide {
  grid-column: 1 / -1;
}

.modal-actions {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  margin-top: 16px;
  flex-wrap: wrap;
}

.error {
  margin-top: 12px;
  padding: 10px 12px;
  border-radius: 8px;
  color: var(--red);
  background: var(--red-soft);
  font-size: 13px;
}

.toast {
  position: fixed;
  right: 20px;
  bottom: 20px;
  z-index: 30;
  max-width: min(420px, calc(100vw - 40px));
  padding: 12px 16px;
  border-radius: 8px;
  color: #fff;
  background: #17221f;
  box-shadow: var(--shadow);
  transform: translateY(16px);
  opacity: 0;
  pointer-events: none;
  transition: transform 0.18s ease, opacity 0.18s ease;
}

.toast.show {
  transform: translateY(0);
  opacity: 1;
}

@media (max-width: 1180px) {
  .admin-app {
    grid-template-columns: 1fr;
    background: var(--bg);
  }

  .sidebar {
    position: static;
    height: auto;
  }

  .side-nav {
    grid-template-columns: repeat(6, minmax(120px, 1fr));
  }

  .metrics,
  .category-grid {
    grid-template-columns: repeat(2, minmax(180px, 1fr));
  }

  .grid-2 {
    grid-template-columns: 1fr;
  }

  .admin-section-grid {
    grid-template-columns: 1fr;
  }
}

@media (max-width: 720px) {
  .admin-main,
  .sidebar,
  .login-card {
    padding: 18px;
  }

  .metrics,
  .category-grid,
  .editor-grid,
  .side-nav {
    grid-template-columns: 1fr;
  }

  .topbar h1 {
    font-size: 25px;
  }

  .toolbar label,
  .toolbar button,
  .row-actions button,
  .modal-actions button {
    width: 100%;
  }
}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast"></div>

<script>
const state = {
  user: null,
  dashboard: null,
  active: "overview",
  scholarshipSearch: "",
  scholarshipCategory: "All categories",
  scholarshipSource: "All sources",
  userSearch: "",
  subscriptionSearch: "",
  modal: null,
  loading: false
};

const root = document.getElementById("app");
const toastEl = document.getElementById("toast");

function h(tag, attrs = {}, ...children) {
  const el = document.createElement(tag);
  Object.entries(attrs || {}).forEach(([key, value]) => {
    if (value === undefined || value === null || value === false) return;
    if (key === "className") el.className = value;
    else if (key === "htmlFor") el.htmlFor = value;
    else if (key === "checked" || key === "selected" || key === "disabled") el[key] = Boolean(value);
    else if (key === "value") el.value = value;
    else if (key.startsWith("on") && typeof value === "function") {
      el.addEventListener(key.slice(2).toLowerCase(), value);
    } else {
      el.setAttribute(key, value);
    }
  });
  children.flat(Infinity).forEach((child) => {
    if (child === undefined || child === null || child === false) return;
    el.appendChild(child instanceof Node ? child : document.createTextNode(String(child)));
  });
  return el;
}

function showToast(message) {
  toastEl.textContent = message;
  toastEl.classList.add("show");
  window.clearTimeout(showToast.timer);
  showToast.timer = window.setTimeout(() => toastEl.classList.remove("show"), 2600);
}

async function apiCall(path, options = {}) {
  const headers = {
    "Content-Type": "application/json",
    ...(options.headers || {})
  };
  
  // Add authorization token if user is logged in
  const token = localStorage.getItem('zawadi:admin_token');
  if (token) {
    headers['Authorization'] = `Bearer ${token}`;
  }
  
  const response = await fetch(path, {
    credentials: "include",
    ...options,
    headers
  });
  const payload = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(payload.error || "Request failed");
  return payload;
}

function formatDate(value) {
  if (!value) return "Not set";
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return value;
  return date.toLocaleDateString();
}

function listText(value) {
  return Array.isArray(value) ? value.join(", ") : value || "";
}

function splitList(value) {
  return String(value || "")
    .split(",")
    .map((item) => item.trim())
    .filter(Boolean);
}

function setActive(active) {
  state.active = active;
  render();
}

async function loadDashboard() {
  state.loading = true;
  render();
  try {
    const [usersData, scholarshipsData] = await Promise.all([
      apiCall("/api/admin/users"),
      apiCall("/api/admin/scholarships")
    ]);
    state.dashboard = {
      users: usersData.users || [],
      subscriptions: usersData.subscriptions || [],
      subscriptionStats: usersData.subscriptionStats || {},
      categories: usersData.categories || [],
      sources: usersData.sources || [],
      ingestion: usersData.ingestion || { configured: false, endpoint: "/api/ingest", botInjected: 0, recent: [] },
      audit: usersData.audit || { issues: [], summary: { total: 0, critical: 0, warning: 0, info: 0 } },
      plans: usersData.plans || [],
      scholarships: scholarshipsData.scholarships || [],
      scholarshipStats: scholarshipsData.stats || {},
      stats: {
        totalUsers: (usersData.users || []).length,
        paidUsers: (usersData.users || []).filter((u) => u.is_paid).length,
        totalScholarships: (scholarshipsData.scholarships || []).length,
        verifiedScholarships: (scholarshipsData.scholarships || []).filter((s) => s.verifiedAt).length,
        unverifiedScholarships: (scholarshipsData.scholarships || []).filter((s) => !s.verifiedAt).length,
        totalApplications: usersData.stats?.totalApplications || 0,
        totalDocuments: usersData.stats?.totalDocuments || 0,
        missingLinks: usersData.stats?.missingLinks || 0
      }
    };
  } catch (error) {
    if (error.message.includes("Authentication") || error.message.includes("Admin")) {
      state.user = null;
      state.dashboard = null;
      renderLogin(error.message);
      return;
    }
    showToast(error.message);
  } finally {
    state.loading = false;
    render();
  }
}

function renderLogin(error = "") {
  document.querySelectorAll(".modal-backdrop").forEach((node) => node.remove());
  root.replaceChildren(
    h("main", { className: "login-shell" },
      h("section", { className: "login-card" },
        h("div", { className: "brand-row" },
          h("div", { className: "brand-mark" }, "Z"),
          h("div", {},
            h("strong", {}, "Techsari Zawadi"),
            h("span", {}, "Admin Console")
          )
        ),
        h("h1", {}, "Admin sign in"),
        h("p", {}, "Manage scholarships, users, ingestion, statistics, and system audit findings from one secure console."),
        h("form", { className: "form-grid", onsubmit: handleLogin },
          h("label", {}, "Email", h("input", { name: "email", type: "email", autocomplete: "username", value: "admin@zawadi.app", required: true })),
          h("label", {}, "Password", h("input", { name: "password", type: "password", autocomplete: "current-password", required: true })),
          h("button", { className: "primary-btn full", type: "submit", disabled: state.loading }, state.loading ? "Signing in..." : "Sign in"),
          error ? h("div", { className: "error" }, error) : null
        )
      )
    )
  );
}

async function handleLogin(event) {
  event.preventDefault();
  const form = new FormData(event.currentTarget);
  state.loading = true;
  renderLogin();
  try {
    const data = await apiCall("/api/admin/login", {
      method: "POST",
      body: JSON.stringify({
        email: form.get("email"),
        password: form.get("password")
      })
    });
    state.user = data.user;
    
    // Store JWT token from session for subsequent requests
    if (data.session?.access_token) {
      localStorage.setItem('zawadi:admin_token', data.session.access_token);
    }
    
    await loadDashboard();
  } catch (error) {
    state.loading = false;
    localStorage.removeItem('zawadi:admin_token');
    renderLogin(error.message);
  }
}

async function handleLogout() {
  try {
    await apiCall("/api/user/profile", { method: "GET" }).catch(() => {});
  } catch (e) {
    // Expected to fail, we're logging out
  }
  localStorage.removeItem('zawadi:admin_token');
  state.user = null;
  state.dashboard = null;
  renderLogin();
}

function render() {
  document.querySelectorAll(".modal-backdrop").forEach((node) => node.remove());
  if (!state.user) {
    renderLogin();
    return;
  }

  root.replaceChildren(
    h("main", { className: "admin-app" },
      renderSidebar(),
      h("section", { className: "admin-main" },
        renderTopbar(),
        state.loading && !state.dashboard ? h("section", { className: "empty" }, "Loading admin data...") : renderActiveView()
      )
    )
  );

  if (state.modal) document.body.appendChild(renderModal());
}

function renderSidebar() {
  const tabs = [
    ["overview", "Overview"],
    ["scholarships", "Scholarships"],
    ["users", "Users"],
    ["subscriptions", "Subscriptions"],
    ["ingestion", "Ingestion"],
    ["audit", "Audit"]
  ];
  return h("aside", { className: "sidebar" },
    h("div", { className: "brand-row" },
      h("div", { className: "brand-mark" }, "Z"),
      h("div", {},
        h("strong", {}, "Zawadi Admin"),
        h("span", {}, "Management console")
      )
    ),
    h("nav", { className: "side-nav", "aria-label": "Admin sections" },
      tabs.map(([id, label]) =>
        h("button", { type: "button", className: state.active === id ? "active" : "", onclick: () => setActive(id) }, label)
      )
    ),
    h("div", { className: "endpoint-box" },
      h("span", { className: "eyebrow" }, "Signed in"),
      h("strong", {}, state.user?.name || "Administrator"),
      h("span", { className: "muted" }, state.user?.email || "Admin session")
    ),
    h("button", { className: "quiet-btn full", type: "button", onclick: () => { window.location.href = "/"; } }, "Open website"),
    h("button", { className: "danger-btn full", type: "button", onclick: handleLogout }, "Sign out")
  );
}

function filteredScholarships() {
  const query = state.scholarshipSearch.trim().toLowerCase();
  return (state.dashboard.scholarships || []).filter((row) => {
    const haystack = [
      row.name,
      row.provider,
      row.host,
      row.source,
      row.fundingType,
      row.description,
      listText(row.countries),
      listText(row.fields),
      listText(row.categories)
    ].join(" ").toLowerCase();
    if (query && !haystack.includes(query)) return false;
    if (state.scholarshipCategory !== "All categories" && !(row.fields || []).includes(state.scholarshipCategory)) return false;
    if (state.scholarshipSource !== "All sources" && row.source !== state.scholarshipSource) return false;
    return true;
  });
}

  if (status === "active") return "pill green";
  if (status === "trial") return "pill gold";
  if (status === "canceled" || status === "expired" || status === "past_due") return "pill red";
  return "pill";
}

async function updateSubscription(userId, patch) {
  try {
    await apiCall(`/api/admin/subscriptions/${userId}`, {
      method: "PATCH",
      body: JSON.stringify(patch)
    });
    showToast("Subscription updated");
    await loadDashboard();
  } catch (error) {
    showToast(error.message);
  }
}

function startTrialForSubscription(sub) {
  updateSubscription(sub.userId, {
    plan: "plus",
    planStatus: "trial",
    is_paid: false,
    subscriptionAmount: 0,
    subscriptionReference: `admin-trial-${Date.now()}`,
    subscriptionRenewsAt: new Date(Date.now() + 14 * 24 * 60 * 60 * 1000).toISOString()
  });
}

function cancelSubscriptionForUser(sub) {
  if (!window.confirm(`Cancel access for ${sub.email}?`)) return;
  updateSubscription(sub.userId, { action: "cancel", plan: sub.plan });
}

function selectLabel(label, value, options, onChange) {
  return h("label", {}, label, selectInline(value, options.map((option) => [option, option]), onChange));

function selectInline(value, options, onChange) {
  const select = h("select", { onchange: (event) => onChange(event.target.value) },
    options.map(([optionValue, label]) => h("option", { value: optionValue, selected: optionValue === value }, label))
  );
  select.value = value;
  return select;
}

async function saveBulkImport(event) {
  event.preventDefault();
  const raw = new FormData(event.currentTarget).get("raw");
  try {
    const scholarships = parseImport(raw);
    const result = await apiCall("/api/admin/scholarships/bulk", {
      method: "POST",
      body: JSON.stringify({ source: "Admin bulk import", scholarships })
    });
    showToast(`${result.added || 0} added, ${result.skipped || 0} skipped`);
    closeModal();
    await loadDashboard();
  } catch (error) {
    showToast(error.message);
  }
}

function parseImport(raw) {
  const text = String(raw || "").trim();
  if (!text) throw new Error("Nothing to import");
  if (text.startsWith("[") || text.startsWith("{")) {
    const parsed = JSON.parse(text);
    const rows = Array.isArray(parsed) ? parsed : parsed.scholarships;
    if (!Array.isArray(rows)) throw new Error("JSON must be an array or { scholarships: [...] }");
    return rows;
  }
  const lines = text.split(/\r?\n/).filter(Boolean);
  if (lines.length < 2) throw new Error("CSV needs a header and at least one row");
  const headers = lines[0].split(",").map((header) => header.trim());
  return lines.slice(1).map((line) => {
    const cells = line.split(",").map((cell) => cell.trim());
    return headers.reduce((row, header, index) => {
      row[header] = cells[index] || "";
      return row;
    }, {});
  });
}

function renderSubscriptionModal(subscription) {
  return h("div", { className: "modal-backdrop", onclick: (event) => { if (event.target.className === "modal-backdrop") closeModal(); } },

        h("label", {}, h("input", { name: "is_paid", type: "checkbox", checked: subscription.is_paid }), " Paid subscription"),

        )
      )

function toDateTimeLocal(value) {
  if (!value) return "";
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return "";
  const offset = date.getTimezoneOffset() * 60000;
  return new Date(date.getTime() - offset).toISOString().slice(0, 16);
}

async function saveSubscription(event, subscription) {
  event.preventDefault();
  const form = event.currentTarget;
  const selects = form.querySelectorAll("select");
  const renewal = form.elements.subscriptionRenewsAt.value
    ? new Date(form.elements.subscriptionRenewsAt.value).toISOString()
    : "";
  await updateSubscription(subscription.userId, {
    plan: selects[0].value,
    planStatus: selects[1].value,
    is_paid: form.elements.is_paid.checked,
    subscriptionAmount: Number(form.elements.subscriptionAmount.value || 0),
    subscriptionCurrency: form.elements.subscriptionCurrency.value || "USD",
    subscriptionReference: form.elements.subscriptionReference.value,
    subscriptionRenewsAt: renewal,
    action: form.elements.is_paid.checked ? "activate" : "update"
  });
  closeModal();
}
